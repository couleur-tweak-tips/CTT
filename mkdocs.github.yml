INHERIT: mkdocs.yml

plugins:
  # Currently, not all features are avaliable in non-insider, but they're set anyways for future-proofing
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-social-cards
  - social:
      cards_layout_options:
        background_color: "#131313"
        color: "#BF6BFF"
        font_family: Inter
  - glightbox
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search
  - search

  # https://github.com/ultrabug/mkdocs-static-i18n — zh pages are <name>.zh.md next to the English source; built under /zh/
  # keep in sync with the i18n block in mkdocs.yml (INHERIT replaces the whole plugins list)
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            About CTT: 关于 CTT
            Contributing: 参与贡献
            Contact: 联系方式
            Credits: 致谢
            Video: 视频
            Which codec should I use?: 我该选哪种编解码器？
            FFmpeg scripts: FFmpeg 脚本
            Upscaling: 超分辨率
            Misc. scripts: 杂项脚本
            Video cutters: 视频剪切工具
            Installation: 安装
            Use cases examples: 使用场景示例
            Recipe configuration: 配方配置
            Troubleshooting: 故障排除
            Command line arguments: 命令行参数
